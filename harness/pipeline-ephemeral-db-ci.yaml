pipeline:
  name: Ephemeral DB CI
  identifier: ephemeral_db_ci
  projectIdentifier: <<PROJECT_ID>>
  orgIdentifier: <<ORG_ID>>
  tags: {}

  # Required, not cosmetic. Without it, selective stage execution is rejected
  # outright — `POST /pipeline/api/pipeline/execute/{id}/stages` returns
  # HTTP 400 "Stage executions are not allowed for pipeline [...]", and the UI
  # offers no stage picker. The headline acceptance check for this repo is
  # "run stage 1 alone, then stage 3 alone, confirm the namespace is gone",
  # which is exactly a selective stage execution. Observed: the 400 above, on
  # a pipeline identical to this one but missing this key.
  allowStageExecutions: true

  # No properties.ci.codebase block here, deliberately. A codebase block takes
  # effect for stages that clone a codebase, and no stage here does: stage 2 is
  # a Custom stage, and stages 1 and 3 are IACM stages that set
  # `cloneCodebase: false`. Setting it would look like the repository was
  # available on disk when it was not. The GitClone step in stage 2 does that
  # job explicitly — and because it does, that step's branch is a runtime
  # input: every run has to supply it.
  #
  # Observed consequence of forgetting it: a run that fills in MIGRATION_TOOL
  # but leaves the branch empty fails stage 2 with
  # "[Environment variable DRONE_COMMIT_BRANCH can't be empty or null]" —
  # which names a Drone variable nothing in this pipeline mentions, two levels
  # of abstraction away from the field actually left blank. Stages 1 and 3 run
  # fine, so the failure looks like a migration problem rather than a missing
  # input. The stage-2 GitClone step below is the only runtime input besides
  # MIGRATION_TOOL; see SETUP.md step 7.
  #
  # Stages 1 and 3 do not need a checkout: the IaCM workspace points at this
  # repository and the plugin fetches the Terraform itself.

  variables:
    # Flyway or Liquibase. The migrations themselves are shared: Liquibase runs
    # the same sql/migrations files through sql/db.changelog-master.xml, so both
    # tools apply byte-identical SQL and the broken-migration demo fails the
    # same way under either. Only the DBSchemaApply step differs, because
    # migrationType is fixed on the DB Schema and cannot be an expression —
    # which is why there are two schemas, two instances, and two steps.
    - name: MIGRATION_TOOL
      type: String
      description: "Flyway or Liquibase. Selects which DBSchemaApply step runs."
      required: true
      value: <+input>.default(Flyway).allowedValues(Flyway,Liquibase)

    # There is deliberately no CUSTOM_CA_PEM_B64 variable here any more. Its
    # only consumers were the two Terraform Run steps in the old Custom stages
    # 1 and 3; now that those stages are IACM stages, nothing in this pipeline
    # reads it, and a pipeline variable nobody reads is a trap for the next
    # person. The variable and the shell block that decoded it moved, verbatim,
    # into harness/custom-stages.yaml.example — if you switch to that fallback,
    # paste the variable back, because those steps still reference it.
    #
    # The IaCM-native route for a TLS-inspecting proxy is the workspace
    # environment variable PLUGIN_CA_CERT_PATH. It is NOT a drop-in swap for
    # base64-in-a-variable: it takes a filesystem PATH to "a single PEM file
    # containing one or more certificates (a CA bundle), not a directory", and
    # that file has to be mounted into the build container already — on
    # Kubernetes build infrastructure, through the `volumes` or `podSpecOverlay`
    # fields of the infrastructure spec below. Its DOCUMENTED scope is the
    # provisioner binary download; the failure actually observed here was
    # PROVIDER download from registry.terraform.io during init. The docs say the
    # plugin also exports SSL_CERT_FILE, CURL_CA_BUNDLE and SSL_CERT_DIR, which
    # would plausibly cover providers too — but that is inference from the
    # exported variables, not a documented guarantee, and it has not been
    # tested. See ISSUES.md, issue 14.

  stages:
    ###########################################################################
    # STAGE 1 — Provision a database that did not exist 60 seconds ago.
    #
    # init -> plan -> apply, run by IaCM against the workspace's Terraform. The
    # workspace creates a namespace, a Postgres pod, and a Service at a
    # CONSTANT DNS name. The pod is new every run; the address is not. That
    # distinction is what makes the fixed DB DevOps connector in stage 2 work.
    #
    # STATUS, because it matters more than the explanation below: these two
    # IACM stages are SCHEMA-VALIDATED ONLY. They were checked against
    # Harness's published pipeline JSON schema, and the Kubernetes build
    # infrastructure claim is corroborated by the IaCM delegate docs and by
    # running this exact Terraform as a pod with this exact identity on a real
    # cluster. They have NEVER been executed on app.harness.io — no IaCM
    # workspace was created and the Resources tab has never been seen here.
    # Schema-valid is not "will run": the schema sets additionalProperties
    # nowhere on this path, so misplaced keys validate and are then ignored at
    # runtime. If you want the path with a green run behind it, stages 1 and 3
    # in harness/custom-stages.yaml.example are a drop-in replacement and are
    # proven end to end.
    #
    # ON infrastructure, and why this is NOT `runtime`: an IACM stage takes
    # EITHER a CI-style `infrastructure` block or a `runtime` block. `runtime`
    # has exactly two values, Docker and Cloud, and neither can reach a private
    # API server as a pod — which is why this repo once concluded IaCM could
    # not do the job at all. The conclusion was wrong: Kubernetes build
    # infrastructure is not selected through `runtime`. `infrastructure:
    # KubernetesDirect` runs the plugin in a build POD in the target cluster
    # with a ServiceAccount token mounted, which is exactly what main.tf's
    # provider expects when kube_config_path is empty. See ISSUES.md, issue 6.
    #
    # No `platform:` block. Under KubernetesDirect the OS belongs to the
    # infrastructure spec (`os: Linux`), and there is no arch to choose — the
    # node pool decides. `platform` is schema-optional alongside
    # `infrastructure`, but do NOT nest it inside infrastructure.spec: all five
    # infrastructure variants share one type enum and two of them require
    # `platform`, so nesting it makes the block match several variants at once
    # and the pipeline is rejected with a confusing "is valid under each of ...
    # HostedVmInfraYaml, K8sDirectInfraYaml ...".
    #
    # No `serviceAccountName`. Omitted means the build pod uses the namespace's
    # `default` ServiceAccount, and `default` is precisely what
    # terraform/bootstrap/provisioner-rbac.yaml binds the provisioner
    # ClusterRole to. Naming any other SA here silently un-grants that RBAC and
    # the apply fails Forbidden on the first namespace it creates. There is no
    # placeholder for it on purpose.
    #
    # No `delegateSelectors` either. It is a STAGE-level field, not a spec
    # field, and it is not needed: the Kubernetes connector named below already
    # routes through a delegate. (Putting it under spec: validates and is then
    # ignored, which is the worst of both.)
    #
    # automountServiceAccountToken: true is the load-bearing line. It is also
    # the platform default, and it is set explicitly to document the
    # dependency: without the token in the pod the provider has no in-cluster
    # credentials and kube_config_path stops being optional.
    #
    # cloneCodebase: false is deliberate — see the header comment on
    # properties.ci.codebase.
    #
    # Prerequisite: terraform/bootstrap/provisioner-rbac.yaml, applied once by
    # a cluster admin. It grants this build pod's ServiceAccount the access the
    # Terraform needs. Without it the apply fails Forbidden on the first
    # namespace it tries to create. The optional named-ServiceAccount section
    # in that file is for the Docker/Cloud fallback and is NOT needed here.
    ###########################################################################
    - stage:
        name: Provision Ephemeral DB
        identifier: provision_ephemeral_db
        type: IACM
        spec:
          workspace: <<IACM_WORKSPACE_ID>>
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <<K8S_CONNECTOR>>
              namespace: <<HARNESS_BUILD_NAMESPACE>>
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 5m
                  spec:
                    # `command` is a bare string in the schema with no enum, so
                    # every value in this stage is a typo waiting to validate.
                    # See the longer note on stage 3, where it is dangerous.
                    command: init

              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan

              # The plan -> apply seam is where a gate would go. Neither of the
              # two options is enabled here, and both have a cost worth knowing
              # before you turn it on.
              #
              # An IACMApproval step would hold the pipeline here. The docs are
              # explicit that "the underlying machine running the pipeline
              # remains active until the approval is resolved. This means it
              # will continue consuming compute resources", and that "the
              # approval plan step has a timeout of up to 60 minutes ... Upon
              # timeout, the pipeline fails." That is not just a bill: it widens
              # exactly the window described in ISSUES.md issue 10, where a run
              # cancelled between the apply and stage 2's wake step leaks a
              # database permanently. A human sitting on an approval for forty
              # minutes with the database already created is that window.
              #
              # An OPA gate belongs here too, but NOT as a step-level policy
              # attachment, because that configuration FAILS OPEN. It has to be
              # a policy set with entity type "Terraform Plan" and evaluation
              # event "After Terraform Plan", which fires automatically — the
              # docs say "You do not attach them in the plan or apply step's
              # policy configuration UI ... It will not appear there. This is
              # expected behavior." Attach some other entity type to the plan
              # step and "the plan step does not pass the Terraform plan JSON as
              # input to the policy", so "the policy can pass even when the plan
              # violates the policy rules" — a green gate that checked nothing.
              # Rego reads input.planned_values and input.resource_changes.
              # Verify it with the policy set's Evaluations tab, which "shows
              # the exact input payload passed to the policy"; if the payload is
              # not a plan, the rule never had a chance to fire.
              #
              # Cost estimation renders on the plan without any of this.

              - step:
                  type: IACMTerraformPlugin
                  name: apply
                  identifier: apply
                  timeout: 15m
                  spec:
                    command: apply
                  # Back-to-back runs race the previous run's teardown:
                  # deleting a namespace is asynchronous, so this apply can
                  # arrive while the old one is still Terminating and fail with
                  # "object is being deleted". Retrying is the whole fix — the
                  # namespace finishes terminating within seconds.
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 30s
                              - 60s
                              - 120s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
    ###########################################################################
    # STAGE 2 — Prove the migration against that database.
    #
    # Containerized step group so DB DevOps and the psql steps run inside the
    # cluster, where the Service DNS name resolves.
    #
    # The step group opens with an explicit GitClone. DBSchemaApply brings its
    # own checkout of the DB Schema's repository as a built-in substep, but the
    # psql steps here are plain Run steps in a Custom stage and get nothing —
    # without the clone they fail on a missing sql/ directory.
    #
    # ON connectorRef: every container step needs one. Under Kubernetes build
    # infrastructure it is mandatory — omitting it fails schema validation, and
    # for DBSchemaApply it fails again at runtime with a different message. It
    # must NOT be account.harnessImage: that connector points at Harness's own
    # Artifact Registry, which hosts Harness's first-party step images and not
    # postgres or alpine/k8s. Pointing at it rewrites every image to
    # us-docker.pkg.dev/gar-prod-setup/harness-public/<image> and every pod
    # lands in ImagePullBackOff with "manifest unknown". Use a real registry
    # connector — see ISSUES.md, issue 2.
    ###########################################################################
    - stage:
        name: Migrate and Verify
        identifier: migrate_and_verify
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: Ephemeral DB Checks
                  identifier: ephemeral_db_checks
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <<K8S_CONNECTOR>>
                      namespace: <<HARNESS_BUILD_NAMESPACE>>
                  steps:

                    # ---- 0. Get the SQL onto disk ----
                    # Clones into /harness/<<REPO_NAME>>/, NOT into /harness.
                    # The working directory stays /harness, so every step below
                    # that reads repo files has to cd into the clone first.
                    # cloneDirectory: /harness is rejected outright ("/harness
                    # is an invalid value"), so the cd is the fix. Get this
                    # wrong and the failure surfaces two steps later as
                    # "psql: sql/migrations/V1__baseline.sql: No such file or
                    # directory", while this step still shows green.
                    - step:
                        type: GitClone
                        name: Clone Codebase
                        identifier: clone_codebase
                        spec:
                          connectorRef: <<GIT_CONNECTOR>>
                          repoName: <<REPO_NAME>>
                          # A setup-time placeholder, NOT `<+input>`. This was
                          # `<+input>` and it does not work: the Custom stage's
                          # Initialize step builds the container environment
                          # for every step in the group up front, and a branch
                          # left to runtime input is still empty at that point.
                          # The stage dies before GitClone runs, with
                          # "[Environment variable DRONE_COMMIT_BRANCH can't be
                          # empty or null]" — a Drone variable nothing in this
                          # file mentions. Observed three times on
                          # app.harness.io, including with the branch supplied
                          # in exactly the shape
                          # `GET /pipeline/api/inputSets/template` returns, so
                          # it is not a matter of getting the payload right.
                          # Stages 1 and 3 pass, so it reads as a migration
                          # failure rather than a missing input.
                          build:
                            type: branch
                            spec:
                              branch: <<REPO_BRANCH>>
                        timeout: 5m

                    # ---- 1. Wake the database and wait for it ----
                    # If the idle reaper scaled it to zero, scale it back up.
                    # Because the database is stateless, coming back from zero
                    # yields an empty Postgres — which is exactly what we want
                    # anyway. Then stamp the heartbeat the reaper reads.
                    #
                    # Image note: this was bitnami/kubectl:1.30, which no
                    # longer exists — Bitnami retired its free Docker Hub
                    # catalog, so that tag now fails to pull entirely.
                    #
                    # RBAC note: this step needs get, list, watch and patch on
                    # deployments plus update on deployments/scale, in the
                    # DATABASE namespace, for the BUILD namespace's
                    # ServiceAccount. rollout status opens a watch rather than
                    # polling, and a watch on a named resource still needs list
                    # on the collection. terraform/build-access.tf grants
                    # exactly that set.
                    - step:
                        type: Run
                        name: Wake And Wait For DB
                        identifier: wake_and_wait
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          image: alpine/k8s:1.30.0
                          shell: Sh
                          # IfNotPresent, not Always: five steps here pull from
                          # the same registry on every run, and anonymous
                          # Docker Hub rate-limits per source IP across the
                          # whole cluster.
                          imagePullPolicy: IfNotPresent
                          command: |
                            set -eu
                            NS=<<DB_NAMESPACE>>

                            REPLICAS=$(kubectl get deploy ephemeral-db -n "$NS" \
                              -o jsonpath='{.spec.replicas}')
                            if [ "$REPLICAS" = "0" ]; then
                              echo "Reaper had scaled this to zero. Waking it."
                              kubectl scale deploy ephemeral-db -n "$NS" --replicas=1
                            fi

                            # Heartbeat. Without this the reaper eventually
                            # scales the database out from under a long pipeline.
                            kubectl annotate deploy ephemeral-db -n "$NS" \
                              "harness.io/last-used=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                              --overwrite

                            kubectl rollout status deploy/ephemeral-db -n "$NS" --timeout=180s
                            echo "Database is up."
                        timeout: 10m

                    # ---- 2. Confirm it accepts connections ----
                    - step:
                        type: Run
                        name: Wait For DB Ready
                        identifier: wait_for_db
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          image: postgres:16.4
                          shell: Sh
                          imagePullPolicy: IfNotPresent
                          envVariables:
                            PGHOST: <<DB_HOST>>
                            PGUSER: ci
                            PGDATABASE: app_test
                            PGPASSWORD: <+secrets.getValue("ephemeral_db_password")>
                          command: |
                            set -e
                            for i in $(seq 1 40); do
                              if pg_isready -q; then
                                echo "Database is accepting connections."
                                exit 0
                              fi
                              sleep 3
                            done
                            echo "Database never became ready."
                            exit 1
                        timeout: 5m

                    # ---- 3. Build a production-shaped database ----
                    # V1 stands in for "whatever production looks like today",
                    # and the seed rows are what make the exercise worth doing:
                    # a migration tested against an empty database tests almost
                    # nothing.
                    #
                    # V1 is applied here with psql rather than through DB
                    # DevOps, which leaves the schema populated but with no
                    # migration history table. Both tools have to be told how to
                    # cope with that, in different ways — see the two apply
                    # steps below.
                    - step:
                        type: Run
                        name: Load Baseline And Seed Data
                        identifier: load_seed
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          image: postgres:16.4
                          shell: Sh
                          imagePullPolicy: IfNotPresent
                          envVariables:
                            PGHOST: <<DB_HOST>>
                            PGUSER: ci
                            PGDATABASE: app_test
                            PGPASSWORD: <+secrets.getValue("ephemeral_db_password")>
                          command: |
                            set -e
                            cd <<REPO_NAME>>
                            psql -v ON_ERROR_STOP=1 -q -f sql/migrations/V1__baseline.sql
                            psql -v ON_ERROR_STOP=1 -q -f sql/seed/seed.sql
                            echo "Baseline schema and seed rows loaded:"
                            psql -c "SELECT count(*) AS seeded_orders FROM orders;"
                        timeout: 10m

                    # ---- 4a. Apply the migration under test — Flyway ----
                    # Governance, changelog tracking, and the migration state
                    # dashboard all come from running it through this step
                    # rather than shelling out to flyway directly.
                    #
                    # baselineOnMigrate is load-bearing, not a workaround. The
                    # previous step created the baseline tables with psql, so
                    # Flyway meets a non-empty schema with no history table and
                    # would otherwise abort. With it set, Flyway writes the
                    # history table with a baseline marker at baselineVersion
                    # (1 by default), treats V1 as already applied, and starts
                    # at V2 — which is exactly the migration under review.
                    #
                    # Keep V1 numbered 1 for that reason. If the baseline ever
                    # spans several files, raise baselineVersion to match the
                    # highest of them, or the pipeline will replay them and fail
                    # on objects that already exist.
                    #
                    # No `tag` here. Tag is a Liquibase concept and Flyway has
                    # no equivalent, so supplying it fails the whole pipeline at
                    # plan creation with "Tag is not supported for flyway
                    # migration type" — before any stage runs. Flyway's own
                    # flyway_schema_history is the audit trail.
                    - step:
                        type: DBSchemaApply
                        # Step names are validated against
                        # ^[a-zA-Z_][-0-9a-zA-Z_\s]{0,127}$ — no parentheses,
                        # no colons. "Apply Schema (Flyway)" is rejected.
                        name: Apply Schema Flyway
                        identifier: apply_schema_flyway
                        when:
                          stageStatus: Success
                          condition: <+pipeline.variables.MIGRATION_TOOL> == "Flyway"
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          migrationType: Flyway
                          globalSettings:
                            baselineOnMigrate: "true"
                          dbSchema: <<DB_SCHEMA_FLYWAY>>
                          dbInstance: <<DB_INSTANCE_FLYWAY>>
                        timeout: 15m

                    # ---- 4b. Apply the migration under test — Liquibase ----
                    # Same SQL, same seeded database, same verdict. The
                    # changelog at sql/db.changelog-master.xml points <sqlFile>
                    # at sql/migrations/, so there is no second copy of the
                    # migration to keep in sync.
                    #
                    # No baselineOnMigrate equivalent is needed: the baseline
                    # changeset carries a preCondition with onFail="MARK_RAN"
                    # that checks whether `orders` already exists. If the psql
                    # step got there first, Liquibase records V1 as applied
                    # without running it and proceeds to V2. Unlike
                    # baselineOnMigrate, the same changelog also works against a
                    # genuinely empty database, where the precondition passes and
                    # V1 runs for real.
                    #
                    # This is a DBSchemaApply step, structurally identical to
                    # 4a. The only field that differs is `migrationType`, plus
                    # the DB Schema and Instance it points at — Liquibase needs
                    # its own pair because `migrationType` is fixed on the DB
                    # Schema and cannot be an expression.
                    #
                    # No globalSettings here. baselineOnMigrate is a Flyway
                    # setting and Liquibase has no equivalent; it does not need
                    # one, because the baseline changeset carries the
                    # precondition described above.
                    #
                    # No `tag` either. Keeping the two steps as close to
                    # identical as the platform allows is worth more than a
                    # rollback target the verify step never uses, and `tag` is
                    # the field the earlier "Unable to fetch port details"
                    # investigation suspected. If you want rollback points,
                    # add `tag` here only — Flyway rejects it outright.
                    - step:
                        type: DBSchemaApply
                        name: Apply Schema Liquibase
                        identifier: apply_schema_liquibase
                        when:
                          stageStatus: Success
                          condition: <+pipeline.variables.MIGRATION_TOOL> == "Liquibase"
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          migrationType: Liquibase
                          dbSchema: <<DB_SCHEMA_LIQUIBASE>>
                          dbInstance: <<DB_INSTANCE_LIQUIBASE>>
                        timeout: 15m

                    # ---- 5. Verify. This is the gate. ----
                    # Tool-agnostic on purpose: it asserts about the database,
                    # not about migration metadata, so it is the same six checks
                    # whichever apply step ran.
                    - step:
                        type: Run
                        name: Verify Migration
                        identifier: verify_migration
                        spec:
                          connectorRef: <<DOCKER_CONNECTOR>>
                          image: postgres:16.4
                          shell: Sh
                          imagePullPolicy: IfNotPresent
                          envVariables:
                            PGHOST: <<DB_HOST>>
                            PGUSER: ci
                            PGDATABASE: app_test
                            PGPASSWORD: <+secrets.getValue("ephemeral_db_password")>
                          command: |
                            set -e
                            cd <<REPO_NAME>>
                            psql -v ON_ERROR_STOP=1 -f sql/checks/verify.sql
                            echo "Migration earned its merge."
                        timeout: 10m

    ###########################################################################
    # STAGE 3 — Destroy it. Unconditionally.
    #
    # `when.pipelineStatus: All` is doing real work here: without it, a failed
    # migration leaves the database running and you have reinvented the
    # shared staging database you were trying to escape.
    #
    # Same infrastructure block as stage 1, and for the same reasons — see the
    # comments there, including the note that this path is schema-validated and
    # not yet executed.
    #
    # State comes from the IaCM workspace rather than from a Kubernetes Secret
    # backend, so this destroy sees stage 1's apply without the
    # `cp backend-kubernetes.tf.example backend-kubernetes.tf` the Custom
    # stages need. That copy is not just unnecessary here, it is harmful: a
    # backend block in the workspace's terraform/ directory would divert state
    # away from the platform, and then this destroy would plan against empty
    # state, print "No changes. No objects need to be destroyed.", exit 0, and
    # leave the database running. That failure has been reproduced on purpose;
    # it is a green run that leaks. Platform-owned state is what removes it.
    ###########################################################################
    - stage:
        name: Destroy Ephemeral DB
        identifier: destroy_ephemeral_db
        type: IACM
        when:
          pipelineStatus: All
        spec:
          workspace: <<IACM_WORKSPACE_ID>>
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <<K8S_CONNECTOR>>
              namespace: <<HARNESS_BUILD_NAMESPACE>>
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: destroy_init
                  timeout: 5m
                  spec:
                    command: init

              # PROOFREAD THE TWO `command` VALUES BELOW BY HAND.
              #
              # IACMTerraformPluginInfo.command is a bare {"type": "string"} in
              # the pipeline schema, with no enum. So `plan-destory`, or
              # `initialise`, or any other near-miss passes schema validation,
              # saves cleanly, and fails only when the step actually runs. In
              # stage 1 that costs you a failed provision. Here it costs more:
              # this stage runs under `when: pipelineStatus: All`, so the typo
              # surfaces mid-teardown of real infrastructure, in the one path
              # whose entire job is to not leak a database. A destroy that
              # cannot start is indistinguishable, from the outside, from the
              # leak this stage prevents.
              #
              # The documented values are: init, plan, apply, destroy,
              # plan-destroy, plan-refresh-only, apply-refresh-only,
              # detect-drift, validate, fmt, import, removed.
              - step:
                  type: IACMTerraformPlugin
                  name: plan-destroy
                  identifier: plan_destroy
                  timeout: 10m
                  spec:
                    command: plan-destroy

              - step:
                  type: IACMTerraformPlugin
                  name: destroy
                  identifier: destroy
                  timeout: 10m
                  spec:
                    command: destroy
